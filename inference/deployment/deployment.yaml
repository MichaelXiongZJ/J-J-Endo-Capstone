apiVersion: v1
kind: Namespace
metadata:
  name: rfdetr

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rfdetr-inference
  namespace: rfdetr
spec:
  replicas: 1
  selector:
    matchLabels: { app: rfdetr-inference }
  template:
    metadata:
      labels: { app: rfdetr-inference }
    spec:
      containers:
      - name: rfdetr-inference
        image: x/rfdetr-inference:v1
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
        env:
        - name: RTSP_URL
          value: "rtsp://host.minikube.internal:8554/demo"
        resources:
          requests:
            cpu: "1"
            memory: "1Gi"
          limits:
            cpu: "2"
            memory: "2Gi"
        livenessProbe:
          httpGet: { path: /healthz, port: 8080 }
          initialDelaySeconds: 30
          periodSeconds: 5
        readinessProbe:
          httpGet: { path: /healthz, port: 8080 }
          initialDelaySeconds: 20
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: rfdetr-inference
  namespace: rfdetr
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"
spec:
  selector:
    app: rfdetr-inference
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  type: ClusterIP